name: secret scan

# 不加 paths 过滤：只改文档或只改 PR 描述也要扫
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked files for credentials / local paths
        run: node scripts/check-secrets.mjs
      - name: Self-test the commit-metadata scanner
        run: bash scripts/tests/check-secrets-push-test.sh
      - name: Scan PR commits (author / message) and PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-secrets.mjs --meta "origin/${BASE_REF}..HEAD^2"
      # 直接 push 到 main（不走 PR）时上一步不跑；这里补上。
      # 强推覆盖历史时 before 在本地找不到，脚本会改为扫整条历史。
      - name: Scan pushed commits (author / message)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node scripts/check-secrets.mjs --push "$BEFORE" "$AFTER"
