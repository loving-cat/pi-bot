name: secret scan

# 不加 paths 过滤：只改文档或只改 PR 描述也要扫
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan tracked files for credentials / local paths
        run: node scripts/check-secrets.mjs
      - name: Scan PR commits (author / message) and PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-secrets.mjs --meta "origin/${BASE_REF}..HEAD^2"
