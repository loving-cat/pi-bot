name: CI

# 目标只有一个：共享代码改动，在两端都真的跑一遍。
# 教训：macOS 的 20 个提交合并回 Windows 时，4 个用例直接红 —— 其中 2 个
# （.app/Contents 判断、版本目录解析）是真 bug，分叉期间没人能发现。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台都跑：
        #   · Windows —— PATH / 进程 / 编码 / 换行只在那边暴露；
        #   · macOS   —— 沙箱走 sandbox-exec（Seatbelt）、数据目录在
        #                ~/Library/Application Support、代理从系统设置读，
        #                这些分支在 Linux 上一条都跑不到；
        #   · Linux   —— bwrap 与 XDG 那套。
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 用支持的最低版本，别拿新版掩盖兼容问题
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server deps
        working-directory: server
        # 仓库里没有 package-lock.json（有意不入库），所以用 install 而不是 ci
        run: npm install --omit=dev --no-audit --no-fund
      - name: Capability manifest drift check
        working-directory: server
        # 加能力只该改 src/capabilities.js。派生层里再出现手写工具名就红 ——
        # 这条护栏防的是"结构慢慢长回去"，那种回归不会报错，只会静默出错。
        run: node scripts/check-capability-drift.mjs
      - name: Permission layer consistency check
        working-directory: server
        # 六项一致性：只读漂移 / allow 档覆盖 / 新主体 / 审计完整 /
        # 窄范围 fail-closed / 空范围不限。这一周的四次静默事故都在这六项里。
        run: node scripts/check-consistency.mjs
      - name: Spec ledger and style checks
        run: |
          node scripts/check-spec-progress.mjs
          node scripts/check-style.mjs
          # 旧品牌串（env 前缀 / 请求头 / 包名 / 原生产物）只许变小：
          # 新文件出现就红，已登记文件计数上涨也红。基线在 scripts/legacy-allowlist.json。
          node scripts/check-legacy.mjs
      - name: Run server unit tests
        working-directory: server
        timeout-minutes: 15
        run: node tests/all.mjs
      - name: Packaging script tests
        if: runner.os != 'Windows'
        run: |
          node scripts/tests/all.mjs
          bash scripts/tests/pack-macos-test.sh
      - name: Windows packaging script tests
        if: runner.os == 'Windows'
        run: |
          node scripts/tests/stage-app-build-test.mjs
          node scripts/tests/prepare-windows-bundle-test.mjs
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/pack-windows-test.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/tests/pack-windows-setup-test.ps1

  native:
    name: native launcher (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The Windows sandbox launcher (native/pibot-sandbox) is Rust. It is not
      # required to build the app, but if the crate stops compiling we would
      # only find out on a release machine, and a missing launcher silently
      # turns into "shell refused" for every bot with MCP attached.
      - uses: dtolnay/rust-toolchain@stable
      - name: Build launcher
        working-directory: native/pibot-sandbox
        run: cargo build --release
      - name: Version matches the Node side
        working-directory: native/pibot-sandbox
        run: |
          node ../../server/tools/check-launcher-version.mjs target/release/pibot-sandbox.exe

  app:
    name: app analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PUB_HOSTED_URL: https://pub.dev
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - uses: NuGet/setup-nuget@v4
        if: runner.os == 'Windows'
      # App 的集成用例（local_server_token_test 等）会真起服务端子进程，要有服务端依赖。
      # 不装的话那些用例会自己跳过，等于没测。
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server deps (for app integration tests)
        working-directory: server
        run: npm install --omit=dev --no-audit --no-fund
      - name: Resolve locked Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-pub
      - name: Flutter test
        working-directory: app
        # 桌面端用例里会真的起 node 子进程 / 装依赖，给足时间；
        # windows-latest 上首次 npm install 比本地慢很多。
        timeout-minutes: 20
        run: flutter test --no-pub
      - name: Build Windows desktop client
        if: runner.os == 'Windows'
        working-directory: app
        timeout-minutes: 20
        run: flutter build windows --release --no-pub

  android:
    name: android apk build
    runs-on: ubuntu-latest
    env:
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - uses: actions/checkout@v5
      # 打 apk 要 JDK 17+：runner 上的默认 java 版本会随镜像漂移，钉住。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      # 只造不收：这一步是为了让"安卓编不过"在合并前就红（Gradle 插件升级、
      # 权限清单、compileSdk 36 这类问题，Windows 的 windows-builder 一个都发现不了）。
      - name: Build Android apk
        working-directory: app
        timeout-minutes: 30
        run: flutter build apk --release --no-pub
