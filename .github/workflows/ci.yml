name: CI

# 目标只有一个：共享代码改动，在两端都真的跑一遍。
# 教训：macOS 的 20 个提交合并回 Windows 时，4 个用例直接红 —— 其中 2 个
# （.app/Contents 判断、版本目录解析）是真 bug，分叉期间没人能发现。

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'scripts/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows 必须跑：PATH / 进程 / 编码 / 换行只在那边才暴露
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 用支持的最低版本，别拿新版掩盖兼容问题
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server deps
        working-directory: server
        # 仓库里没有 package-lock.json（有意不入库），所以用 install 而不是 ci
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run server unit tests
        working-directory: server
        timeout-minutes: 15
        run: node tests/all.mjs

  app:
    name: app analyze + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # App 的集成用例（local_server_token_test 等）会真起服务端子进程，要有服务端依赖。
      # 不装的话那些用例会自己跳过，等于没测。
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server deps (for app integration tests)
        working-directory: server
        run: npm install --omit=dev --no-audit --no-fund
      - name: Flutter analyze
        working-directory: app
        run: flutter analyze
      - name: Flutter test
        working-directory: app
        # 桌面端用例里会真的起 node 子进程 / 装依赖，给足时间；
        # windows-latest 上首次 npm install 比本地慢很多。
        timeout-minutes: 20
        run: flutter test
