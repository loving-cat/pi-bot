name: pi_bot
description: "pi-bot 手机端：连自己的 pi agent，群聊、多 Bot、流式输出。"
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  mobile_scanner: ^6.0.2
  # 相机权限显式申请（进扫码页就问，不给就不让扫）
  permission_handler: ^11.3.1
  flutter_local_notifications: ^18.0.1
  lucide_icons_flutter: ^3.1.25
  window_manager: ^0.5.2
  # 拿显示器可用区域（拖动时把窗口夹在当前屏内，避免跨屏触发 DPI 重缩放）
  screen_retriever: ^0.2.2
  # 桌面端：把附件（pdf/word/图片…）直接拖进聊天框
  desktop_drop: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
  fonts:
    # ★ Inter.ttf 是**可变字体**（有 fvar 表），所以只登记一次就够了 ——
    #   Flutter 会按 TextStyle.fontWeight 去走 wght 轴拿到真正的 400/500/600/700。
    #   以前把同一个文件登记了 4 遍、分别标 400/500/600/700：那等于四份都是默认的
    #   400，然后 Flutter 再在它上面**合成假粗体**——笔画发虚、字重看着不对。
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
